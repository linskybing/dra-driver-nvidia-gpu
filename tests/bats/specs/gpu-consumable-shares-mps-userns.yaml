# Two MPS clients in user namespaces (hostUsers: false) on one GPU, pinned to
# __GPU_UUID__. Their host UIDs differ from the daemon's, so the shared daemon
# must run in multi-user mode. Requires the cs-mps-probe-src ConfigMap.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: cs-mps-userns-1
  labels:
    env: batssuite
    test: cs-mps
spec:
  spec:
    devices:
      requests:
      - name: gpu
        exactly:
          deviceClassName: gpu.nvidia.com
          selectors:
          - cel:
              expression: device.attributes["gpu.nvidia.com"].uuid == "__GPU_UUID__"
          capacity:
            requests:
              shares: 1
              memory: 2Gi
      config:
      - requests: ["gpu"]
        opaque:
          driver: gpu.nvidia.com
          parameters:
            apiVersion: resource.nvidia.com/v1beta1
            kind: GpuConfig
            sharing:
              strategy: MPS
              mpsConfig:
                multiUser: true
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: cs-mps-userns-3
  labels:
    env: batssuite
    test: cs-mps
spec:
  spec:
    devices:
      requests:
      - name: gpu
        exactly:
          deviceClassName: gpu.nvidia.com
          selectors:
          - cel:
              expression: device.attributes["gpu.nvidia.com"].uuid == "__GPU_UUID__"
          capacity:
            requests:
              shares: 3
              memory: 4Gi
      config:
      - requests: ["gpu"]
        opaque:
          driver: gpu.nvidia.com
          parameters:
            apiVersion: resource.nvidia.com/v1beta1
            kind: GpuConfig
            sharing:
              strategy: MPS
              mpsConfig:
                multiUser: true
---
apiVersion: v1
kind: Pod
metadata:
  name: cs-mps-userns-1
  labels:
    env: batssuite
    test: cs-mps
spec:
  hostUsers: false
  restartPolicy: Never
  containers:
  - name: ctr
    image: nvidia/cuda:12.5.0-devel-ubuntu22.04
    command: ["bash", "-c", "set -e; nvcc -o /tmp/probe /src/probe.cu; /tmp/probe 1024 3072"]
    resources:
      claims:
      - name: gpu
    volumeMounts:
    - name: src
      mountPath: /src
  volumes:
  - name: src
    configMap:
      name: cs-mps-probe-src
  resourceClaims:
  - name: gpu
    resourceClaimTemplateName: cs-mps-userns-1
---
apiVersion: v1
kind: Pod
metadata:
  name: cs-mps-userns-3
  labels:
    env: batssuite
    test: cs-mps
spec:
  hostUsers: false
  restartPolicy: Never
  containers:
  - name: ctr
    image: nvidia/cuda:12.5.0-devel-ubuntu22.04
    command: ["bash", "-c", "set -e; nvcc -o /tmp/probe /src/probe.cu; /tmp/probe 3072"]
    resources:
      claims:
      - name: gpu
    volumeMounts:
    - name: src
      mountPath: /src
  volumes:
  - name: src
    configMap:
      name: cs-mps-probe-src
  resourceClaims:
  - name: gpu
    resourceClaimTemplateName: cs-mps-userns-3
